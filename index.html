<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>커스텀 스킨 뷰어</title><script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#10151d;color:#edf3fa;font:16px system-ui}header{padding:24px 30px;border-bottom:1px solid #334155}h1{margin:0;font-size:25px}p{color:#adbdd0;line-height:1.6}main{display:grid;grid-template-columns:320px 1fr;min-height:76vh}aside{padding:24px;border-right:1px solid #334155}label{display:block;margin:20px 0 8px}button,select,input[type=file]{width:100%;padding:12px;border:1px solid #63758e;border-radius:8px;background:#25344a;color:white}button{cursor:pointer;margin-top:12px;background:#3063c6}button:disabled{opacity:.5;cursor:wait}model-viewer{width:100%;height:76vh;background:radial-gradient(#344153,#10151d)}#status{padding:14px 0;white-space:pre-wrap;color:#9fc7ff}#warnings{font-size:13px;color:#d3b67a}input[type=range]{width:100%}.empty{padding:28px;color:#aebed0}#details{font-size:14px}@media(max-width:700px){main{grid-template-columns:1fr}aside{border:0}model-viewer{height:65vh}}</style>
<header><h1>커스텀 스킨 뷰어</h1><p>모드를 올리면 챔피언을 찾고 설치된 롤의 원본 애니메이션을 연결합니다. 파일은 이 컴퓨터에서만 처리됩니다.</p></header>
<main><aside><label for="mode">가져오기 방식</label><select id="mode"><option value="file">ZIP / FANTOME 파일</option><option value="folder">모드 모음 폴더 (한 번 업로드)</option></select><label for="file" id="filelabel">ZIP / FANTOME 모드</label><input id="file" type="file" accept=".zip,.fantome"><input id="folder" type="file" webkitdirectory multiple hidden><div id="selection" style="font-size:13px;margin-top:8px"></div><button id="upload">모드 열기</button><div id="status" role="status">파일을 선택해주세요.</div><div id="details"></div><label for="library">저장된 폴더</label><select id="library"></select><label for="modlist">모드 목록</label><select id="modlist"></select><button id="openmod">선택한 모드 보기</button><button id="bind">정지 모델로 확인</button><label for="animation">애니메이션</label><select id="animation" disabled></select><button id="play" disabled>일시정지</button><label for="speed">재생 속도 <span id="rate">1×</span></label><input id="speed" type="range" min="0" max="2" step=".1" value="1"><label for="bg">배경색</label><input id="bg" type="color" value="#10151d"><p>드래그: 회전<br>휠: 확대·축소<br>우클릭 드래그: 이동</p><div id="warnings"></div></aside><section><model-viewer id="viewer" camera-controls autoplay shadow-intensity="1"></model-viewer></section></main>
<script>
const $=x=>document.querySelector(x),v=$('#viewer'),a=$('#animation'),p=$('#play'),u=$('#upload'),s=$('#status'),mode=$('#mode'),fi=$('#file'),fo=$('#folder');let libs=[],lastModel='',isBind=false;
async function api(url,options){const r=await fetch(url,options),j=await r.json();if(!r.ok)throw Error(j.error);return j}
function fillMods(){const lib=libs.find(x=>x.id===$('#library').value);$('#modlist').replaceChildren(...(lib?.items||[]).map((x,i)=>new Option(x.name,i)))}
async function refresh(id){libs=await api('/libraries');$('#library').replaceChildren(...libs.map(x=>new Option(x.items.length+'개 모드 · '+x.id.slice(0,6),x.id)));if(id)$('#library').value=id;fillMods()}
$('#library').onchange=fillMods;
mode.onchange=()=>{fi.hidden=mode.value==='folder';fo.hidden=mode.value!=='folder';$('#filelabel').textContent=mode.value==='folder'?'상위 폴더 선택':'ZIP / FANTOME 모드';$('#selection').textContent=''};
fo.onchange=()=>$('#selection').textContent=fo.files.length+'개 파일 선택됨';
async function monitor(id){while(true){await new Promise(r=>setTimeout(r,1000));const st=await api('/status/'+id);s.textContent=st.message;if(st.status==='error')throw Error(st.message);if(st.status==='done'){$('#details').textContent=st.champion+' / '+st.skin;$('#warnings').textContent=st.warnings.join('\n');lastModel=st.model;isBind=false;v.src=lastModel;return}}}
v.addEventListener('load',()=>{a.replaceChildren(...v.availableAnimations.map(n=>new Option(n,n)));a.disabled=!a.options.length;a.value=v.availableAnimations.find(n=>n.endsWith('idle1'))||a.value;v.animationName=a.value;p.disabled=isBind;v.play();p.textContent='일시정지';s.textContent=isBind?'정지 모델 · 뼈대 기본 자세':'표시 완료 · 애니메이션 '+v.availableAnimations.length+'개'});
v.addEventListener('error',()=>s.textContent='3D 모델 표시 실패. WebGL과 인터넷 연결을 확인해주세요.');
u.onclick=async()=>{u.disabled=true;try{if(mode.value==='folder'){const files=Array.from(fo.files);if(!files.length)throw Error('폴더를 선택해주세요.');if(files.reduce((n,x)=>n+x.size,0)>5*1024**3)throw Error('폴더는 최대 5GB입니다.');const lib=await api('/library/create',{method:'POST'});for(let i=0;i<files.length;i++){const f=files[i];s.textContent='폴더 저장 '+(i+1)+'/'+files.length+' · '+f.name;await api('/library/file/'+lib.id+'?path='+encodeURIComponent(f.webkitRelativePath||f.name),{method:'PUT',body:f})}const result=await api('/library/finish/'+lib.id,{method:'POST'});await refresh(lib.id);s.textContent=result.items.length+'개 모드를 찾았습니다. 목록에서 선택해주세요.'}else{if(!fi.files[0])throw Error('파일을 선택해주세요.');s.textContent='업로드 중…';const j=await api('/upload',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:fi.files[0]});await monitor(j.id)}}catch(e){s.textContent='처리 실패: '+e.message}finally{u.disabled=false}};
$('#openmod').onclick=async()=>{const b=$('#openmod');b.disabled=true;try{if(!$('#library').value||!$('#modlist').options.length)throw Error('저장된 폴더에서 모드를 선택해주세요.');const j=await api('/library/open/'+$('#library').value+'/'+$('#modlist').value,{method:'POST'});await monitor(j.id)}catch(e){s.textContent='처리 실패: '+e.message}finally{b.disabled=false}};
$('#bind').onclick=()=>{if(!lastModel)return;isBind=!isBind;$('#bind').textContent=isBind?'애니메이션 모델로 돌아가기':'정지 모델로 확인';v.src=lastModel+(isBind?'?pose=bind':'')};
a.onchange=()=>{v.animationName=a.value;v.play();p.textContent='일시정지'};p.onclick=()=>{if(v.paused){v.play();p.textContent='일시정지'}else{v.pause();p.textContent='재생'}};$('#speed').oninput=e=>{v.timeScale=+e.target.value;$('#rate').textContent=e.target.value+'×'};$('#bg').oninput=e=>v.style.background=e.target.value;refresh().catch(e=>s.textContent=e.message);
</script></html>
